services:
  db:
    image: postgres:14
    volumes:
      - ./data/db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file:
      - ./.env_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "python3 manage.py migrate --fake sessions zero && python3 manage.py migrate --fake-initial && python3 manage.py collectstatic --no-input && python3 manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/code
      - ./backend/static:/static
      - ./backend/media:/media
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./.env_backend
    environment:
      OLLAMA_SERVER: ${OLLAMA_SERVER:-http://host.docker.internal:11434}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    links:
      - db

  nginx:
    build: ./nginx
    volumes:
      - ./backend/static:/static
      - ./label_studio/data:/label_studio/data
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - label_studio

  frontend:
    build: ./frontend
    env_file:
      - ./.env_frontend
    volumes:
      # - .:/code
      - ./frontend/build:/build
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
      grobid:
        condition: service_healthy

  grobid:
    image: lfoppiano/grobid:latest-crf
    ports:
      - "8070:8070"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./grobid/logs:/var/log/grobid
    environment:
      - JAVA_OPTS=-Xmx4g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8070/"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

  mcp_server:
    build: ./MCP-server
    # image: ghcr.io/stjude/mygpt-mcp-server:latest
    volumes:
      - ./MCP-server:/app
      # Keep the image's built venv; don't let the bind mount above shadow it.
      - /app/.venv
    ports:
      - "5001:5001"
    depends_on:
      backend:
        condition: service_healthy

  ollama:
    build: ./ollama
    # set environment variables
    environment:
      - OLLAMA_ORIGINS=http://localhost:*
    volumes:
        - ./ollama/models:/root/.ollama/models
    ports:
        - 11434:11434
    container_name: ollama
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 16G

  evaluation:
    build: ./evaluation
    volumes:
      - ./evaluation:/code

  label_studio:
    image: heartexlabs/label-studio:latest
    ports:
      - "8080:8080"
    volumes:
      - ./label_studio/data:/label-studio/data
    depends_on:
      backend:
        condition: service_healthy
