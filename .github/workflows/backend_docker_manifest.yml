name: Backend create latest manifest

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: create manifest 
        uses: int128/docker-manifest-create-action@v2
        with:
          tags: |
            ghcr.io/stjude/mygpt-backend:latest
          sources: |
            ghcr.io/stjude/mygpt-backend:latest-amd64
            ghcr.io/stjude/mygpt-backend:latest-arm64